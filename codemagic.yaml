# Test app: the kit's template without Google Play publishing and without the iOS workflow (this app isn't in the stores).
# Signed release builds on Codemagic (codemagic.io). One-time setup for each app: docs/ai/codemagic.md
# Both workflows start when a version tag is pushed (git push origin v1.2.0); you can also start them in Codemagic.
# Build numbers are set on the build machine only (one more than the store's latest), so the repo never needs a bump for them.
workflows:
  android-release:
    name: Android release
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering: &on_version_tag
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    environment:
      android_signing:
        - upload_keystore
      node: 24
      java: 17
    scripts:
      - name: Release check
        script: node scripts/ai/release-check.js
      - name: Install dependencies
        script: sh scripts/ai/install-deps.sh
      - name: Store release notes
        script: cp "release-notes/${CM_TAG#v}/play-store.txt" release_notes.txt 2>/dev/null || true
      - name: Build the signed app bundle
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          package=$(sed -n -E 's/.*applicationId( =)? "([^"]+)".*/\2/p' android/app/build.gradle* | head -1)
          if last=$(google-play get-latest-build-number --package-name "$package") && [ -n "$last" ]; then code=$((last + 1)); else code=$BUILD_NUMBER; fi
          # AGP 9 ignores injected version codes, so the number is written into build.gradle on this machine only
          sed -i '' -E "s/versionCode( =)? [0-9]+/versionCode\1 $code/" android/app/build.gradle*
          grep -qE "versionCode( =)? $code" android/app/build.gradle* || { echo "No versionCode number in android/app/build.gradle to set"; exit 1; }
          # the upload key from Codemagic; build.gradle keeps debug signing for local release builds
          cd android && ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

